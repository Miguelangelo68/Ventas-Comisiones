<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cuadro de Ventas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--bg2:#161b22;--card:#1c2230;--line:#2b3244;--txt:#e6edf3;--dim:#8b98a9;--acc:#4dabf7;--acc2:#38d9a9;--good:#38d9a9;--bad:#ff6b6b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.4}
.mono{font-family:'JetBrains Mono',monospace}
header{position:sticky;top:0;z-index:20;background:rgba(13,17,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px}
h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.3px}
.sub{color:var(--dim);font-size:12px;margin-top:2px}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
select,input{width:100%;padding:12px 14px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--txt);font-size:15px;font-family:inherit;outline:none}
select:focus,input:focus{border-color:var(--acc)}
.controls{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.controls>*{flex:1;min-width:150px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .v{font-size:19px;font-weight:700;font-family:'JetBrains Mono',monospace}
.kpi .l{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.kpi .d{font-size:11px;margin-top:3px;font-weight:700}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:8px 0 4px;-webkit-overflow-scrolling:touch}
.tab{white-space:nowrap;padding:9px 14px;background:var(--bg2);border:1px solid var(--line);border-radius:20px;color:var(--dim);font-size:13px;font-weight:500;cursor:pointer;user-select:none}
.tab.on{background:var(--acc);border-color:var(--acc);color:#04121f}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.name{font-weight:500}
.val{font-family:'JetBrains Mono',monospace;font-weight:700;white-space:nowrap}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:5px;vertical-align:middle}
.tag{font-size:11px;color:var(--dim)}
.clk{cursor:pointer}.clk:hover{border-color:var(--acc)}
.muted{color:var(--dim);font-size:13px}
.sec-title{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin:18px 2px 8px}
.insight{background:linear-gradient(90deg,rgba(77,171,247,.12),transparent);border-left:3px solid var(--acc);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.up{color:var(--good)}.down{color:var(--bad)}
/* ---- FICHA CLIENTE (modal grande) ---- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:0}
.modal.show{display:flex}
.modal .box{background:var(--bg);border:1px solid var(--line);border-radius:0;max-width:720px;width:100%;min-height:100%;padding:0}
@media(min-width:760px){.modal{padding:28px}.modal .box{min-height:auto;border-radius:20px;margin:0 auto}}
.mhead{position:sticky;top:0;background:linear-gradient(180deg,#1c2230,#161b22);border-bottom:1px solid var(--line);padding:20px 22px 18px;border-radius:0}
@media(min-width:760px){.mhead{border-radius:20px 20px 0 0}}
.mhead h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.4px;padding-right:36px;line-height:1.2}
.mhead .meta{color:var(--dim);font-size:13px;margin-top:8px}
.mhead .alias{color:var(--dim);font-size:12px;margin-top:4px;opacity:.8}
.x{position:absolute;top:16px;right:18px;width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--txt);cursor:pointer;font-size:22px;line-height:32px;text-align:center}
.mbody{padding:18px 22px 40px}
/* resumen 3 años */
.totrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:22px}
.totbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center}
.totbox.hl{border-color:var(--acc2);background:linear-gradient(180deg,rgba(56,217,169,.12),var(--card))}
.totbox .ty{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.totbox .tv{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;margin-top:6px}
.totbox.hl .tv{color:var(--acc2);font-size:21px}
.mbody h3{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;margin:0 0 12px}
/* tarjeta representada */
.rep-grid{display:grid;grid-template-columns:1fr;gap:12px}
.rep-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.rep-box .rtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rep-box .rn{font-size:14px;font-weight:700;letter-spacing:.3px}
.rep-box .r26{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:22px}
.rep-box .rsub{color:var(--dim);font-size:11px;margin-top:2px}
.hist{display:flex;gap:22px;margin-top:12px}
.hist .h{font-size:13px}.hist .h span{color:var(--dim);font-size:11px;display:block;text-transform:uppercase;letter-spacing:.4px}
.hist .h b{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--dim)}
.pacebar{margin-top:14px}
.pacebar .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:5px}
.track{height:9px;background:var(--line);border-radius:6px;position:relative;overflow:hidden}
.track .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:#5a6577}
.track i{position:absolute;top:0;bottom:0;border-radius:6px}
.ritmo{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:8px;margin-top:12px}
.ritmo.up{background:rgba(56,217,169,.16);color:var(--good)}
.ritmo.down{background:rgba(255,107,107,.16);color:var(--bad)}
.ritmo.flat{background:var(--line);color:var(--dim)}
.small{font-size:12px}.gray{color:var(--dim)}
.chip{font-size:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--dim)}
@media(max-width:560px){.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:17px}.mhead h2{font-size:20px}.totbox .tv{font-size:16px}.totbox.hl .tv{font-size:18px}}
</style>
</head>

</div>

const rutaSel=document.getElementById("ruta");
const RUTAS=[...new Set(ENT.map(e=>e.ruta).filter(Boolean))].sort();
rutaSel.innerHTML='<option value="all">TODAS las rutas</option>'+RUTAS.map(r=>`<option value="${r}">Ruta ${r}</option>`).join("")+'<option value="__sin">Sin ruta</option>';
const inR=e=> RUTA==="all"?true:(RUTA==="__sin"?!e.ruta:(e.ruta||"")===RUTA);
const comercialSel=document.getElementById("comercial");
const COMS=[...new Set(ENT.map(e=>e.comercial).filter(Boolean))].sort();
comercialSel.innerHTML='<option value="all">TODOS los comerciales</option>'+COMS.map(c=>`<option value="${c}">${c}</option>`).join("")+'<option value="__sin">Sin asignar</option>';
const inC=e=> COMERCIAL==="all"?true:(COMERCIAL==="__sin"?!e.comercial:(e.comercial||"")===COMERCIAL);
const TABS=[["top","Top 10"],["abc","ABC"],["multi","Multi-Rep"],["crec","En alza"],["caid","En bajada"],["todos","Todos"]];
document.getElementById("tabs").innerHTML=TABS.map(([k,n])=>`<div class="tab" data-t="${k}">${n}</div>`).join("");

function activeList(){
 let l=ENT.filter(e=>(t26(e,REP)!==0||t25(e,REP)!==0)&&inR(e)&&inC(e));
 if(Q){const q=Q.toLowerCase();l=l.filter(e=>(e.nombre||"").toLowerCase().includes(q)||(e.cif||"").toLowerCase().includes(q)||(e.aliases||[]).some(a=>a.toLowerCase().includes(q)));}
 return l;
}
function kpis(){
 const EK=ENT.filter(e=>inR(e)&&inC(e));
 const t26all=EK.reduce((s,e)=>s+t26(e,REP),0);
 const t25all=EK.reduce((s,e)=>s+t25(e,REP),0);
 const t24all=EK.reduce((s,e)=>s+t24(e,REP),0);
 const n=EK.filter(e=>t26(e,REP)>0).length;
 const pc=t25all>0?((t26all-t25all/2)/(t25all/2)*100):null;
 const pcs=pc===null?"":`<div class="d ${pc>=0?'up':'down'}">${pc>=0?'▲':'▼'} ${Math.abs(pc).toFixed(0)}% vs ritmo 2025</div>`;
 document.getElementById("hdrtot").innerHTML="Total 2026: "+eur0(ENT.reduce((s,e)=>s+t26(e,"all"),0));
 document.getElementById("kpis").innerHTML=`
  <div class="kpi"><div class="v">${eur0(t26all)}</div><div class="l">2026 a junio</div>${pcs}</div>
  <div class="kpi"><div class="v">${eur0(t25all)}</div><div class="l">2025 (año completo)</div></div>
  <div class="kpi"><div class="v">${eur0(t24all)}</div><div class="l">2024 (año completo)</div></div>
  <div class="kpi"><div class="v">${n}</div><div class="l">Clientes activos 2026</div></div>`;
}
function line(e,extra=""){
 const v=t26(e,REP);const p=pace(e,REP);
 const pt=p===null?"":`<span class="chip ${p>=0?'up':'down'}">${p>=0?'+':''}${p.toFixed(0)}% vs ritmo 25</span>`;
 return `<div class="card row clk" onclick="ficha('${e.k}')">
   <div><div class="name">${e.nombre}</div><div class="tag">${e.cif||'<span class=chip>sin CIF</span>'} ${e.ruta?`<span class="chip">Ruta ${e.ruta}</span>`:""} ${extra} ${pt}</div></div>
   <div class="val">${eur(v)}</div></div>`;
}
const insight=t=>`<div class="insight">${t}</div>`;

function render(){
 kpis();
 document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.t===TAB));
 const out=document.getElementById("out");
 let l=activeList();
 const repLbl=REP==="all"?"todas las representadas":RN[REP];
 if(Q){out.innerHTML=`<div class="sec-title">Resultados de "${Q}" · ${l.length}</div>`+
   (l.length?l.sort((a,b)=>t26(b,REP)-t26(a,REP)).map(e=>line(e)).join(""):`<div class="muted">Sin resultados.</div>`);return;}
 if(TAB==="top"){
   l=l.filter(e=>t26(e,REP)>0).sort((a,b)=>t26(b,REP)-t26(a,REP));const top=l.slice(0,10);
   const tot=l.reduce((s,e)=>s+t26(e,REP),0);const share=tot?top.reduce((s,e)=>s+t26(e,REP),0)/tot*100:0;
   out.innerHTML=`<div class="sec-title">Top 10 · ${repLbl}</div>`+
     insight(`Los <b>10 mayores</b> concentran el <b>${share.toFixed(1)}%</b> de las ventas 2026 (${eur0(top.reduce((s,e)=>s+t26(e,REP),0))}).`)+
     top.map((e,i)=>line(e,`<span class="chip">#${i+1}</span>`)).join("");
 }
 else if(TAB==="abc"){
   l=l.filter(e=>t26(e,REP)>0).sort((a,b)=>t26(b,REP)-t26(a,REP));const tot=l.reduce((s,e)=>s+t26(e,REP),0);
   let acc=0;const seg={A:[],B:[],C:[]};
   l.forEach(e=>{acc+=t26(e,REP);const p=acc/tot*100;if(p<=80)seg.A.push(e);else if(p<=95)seg.B.push(e);else seg.C.push(e);});
   const sum=a=>a.reduce((s,e)=>s+t26(e,REP),0);
   out.innerHTML=`<div class="sec-title">Segmentación ABC · ${repLbl}</div>`+
     insight(`<b>${seg.A.length}</b> clientes (A) generan el 80% · <b>${seg.B.length}</b> el 15% (B) · <b>${seg.C.length}</b> el 5% (C).`)+
     [["A","#4dabf7","80% ventas"],["B","#ffd43b","15% ventas"],["C","#adb5bd","5% ventas"]].map(([g,col,d])=>
      `<div class="card"><div class="row"><div><span class="pill" style="background:${col};color:#04121f">GRUPO ${g}</span><span class="tag">${d} · ${seg[g].length} clientes</span></div><div class="val">${eur0(sum(seg[g]))}</div></div>
       <div style="margin-top:10px">${seg[g].slice(0,g==='A'?200:8).map(e=>`<div class="row small" style="padding:3px 0"><span class="clk" style="color:var(--txt)" onclick="ficha('${e.k}')">${e.nombre}</span><span class="mono gray">${eur0(t26(e,REP))}</span></div>`).join("")}${seg[g].length>(g==='A'?200:8)?`<div class="muted small" style="margin-top:4px">…y ${seg[g].length-8} más</div>`:""}</div></div>`).join("");
 }
 else if(TAB==="multi"){
   let m=ENT.filter(e=>nreps(e)>=3&&inR(e)&&inC(e));m.sort((a,b)=>nreps(b)-nreps(a)||t26(b,"all")-t26(a,"all"));
   out.innerHTML=`<div class="sec-title">Clientes en 3+ representadas · ${m.length}</div>`+
    insight(`<b>${m.length}</b> clientes te compran en 3 o más representadas: tu base para venta cruzada.`)+
    m.map(e=>`<div class="card row clk" onclick="ficha('${e.k}')"><div><div class="name">${e.nombre}</div><div class="tag">${REPS.filter(([k])=>(e[k]||{}).ventas2026>0).map(([k,n])=>n).join(" · ")}</div></div><div style="text-align:right"><div class="val">${eur0(t26(e,"all"))}</div><div class="tag">${nreps(e)} repr.</div></div></div>`).join("");
 }
 else if(TAB==="crec"||TAB==="caid"){
   const up=TAB==="crec";
   let l2=ENT.filter(inR).map(e=>({e,p:pace(e,REP)})).filter(x=>x.p!==null&&t26(x.e,REP)>0);
   l2=l2.filter(x=>up?x.p>=10:x.p<=-10).sort((a,b)=>up?b.p-a.p:a.p-b.p);
   out.innerHTML=`<div class="sec-title">${up?"En alza (por encima del ritmo 2025)":"En bajada (por debajo del ritmo 2025)"} · ${repLbl}</div>`+
    insight(`Compara tu <b>2026 a junio</b> con la <b>mitad de 2025</b> (ritmo equivalente a medio año). Solo clientes con ventas en ambos años.`)+
    (l2.length?l2.slice(0,60).map(({e,p})=>line(e)).join(""):`<div class="muted">Sin datos suficientes.</div>`);
 }
 else{
   l=l.filter(e=>t26(e,REP)>0).sort((a,b)=>t26(b,REP)-t26(a,REP));
   out.innerHTML=`<div class="sec-title">Todos los clientes activos 2026 · ${l.length}</div>`+l.map(e=>line(e,e.k&&nreps(e)>1?`<span class="chip">${nreps(e)} repr.</span>`:"")).join("");
 }
}
function paceBar(v,v5){
 // barra centrada: 50% = ritmo de 2025 (mitad del año). Verde si por encima, rojo si por debajo.
 const h=v5/2; if(h<=0) return "";
 const p=(v-h)/h*100;
 const cl=p>=5?"up":(p<=-5?"down":"flat");
 const col=p>=5?"var(--good)":(p<=-5?"var(--bad)":"#5a6577");
 // ancho relativo (cap a +/-100% del punto medio)
 const frac=Math.max(-1,Math.min(1,(v-h)/h));
 let bar;
 if(frac>=0) bar=`<i style="left:50%;width:${frac*50}%;background:${col}"></i>`;
 else bar=`<i style="right:50%;width:${(-frac)*50}%;background:${col}"></i>`;
 return `<div class="pacebar">
   <div class="lbl"><span>Ritmo vs 2025 (mitad = ${eur0(h)})</span><span>${p>=0?'+':''}${p.toFixed(0)}%</span></div>
   <div class="track"><div class="mid"></div>${bar}</div>
   <div class="ritmo ${cl}">${p>=0?'▲ Por encima':'▼ Por debajo'} del ritmo del año pasado</div>
 </div>`;
}
function ficha(k){
 const e=DB[k];if(!e)return;
 const tt26=t26(e,"all"),tt25=t25(e,"all"),tt24=t24(e,"all");
 const boxes=REPS.map(([rk,rn])=>{const r=e[rk]||{};const v=r.ventas2026||0,v5=r.ventas2025||0,v4=r.ventas2024||0;
   if(v===0&&v5===0&&v4===0)return"";
   const dto=r.descuento?`Dto ${r.descuento}%`:"";
   const mes=r.meses_2026?`${r.meses_2026} meses con ventas`:"";
   const sub=[dto,mes].filter(Boolean).join(" · ");
   return `<div class="rep-box">
     <div class="rtop"><div><div class="rn">${rn}</div>${sub?`<div class="rsub">${sub}</div>`:""}</div>
       <div style="text-align:right"><div class="r26">${eur0(v)}</div><div class="rsub">2026 a junio</div></div></div>
     <div class="hist">
       <div class="h"><span>2024</span><b>${eur0(v4)}</b></div>
       <div class="h"><span>2025</span><b>${eur0(v5)}</b></div>
     </div>
     ${paceBar(v,v5)}
   </div>`;}).join("");
 document.getElementById("mbox").innerHTML=`
   <div class="mhead">
     <button class="x" onclick="closeM()">×</button>
     <h2>${e.nombre}</h2>
     <div class="meta">${e.cif?'CIF · '+e.cif:'Sin CIF'} &nbsp;·&nbsp; Activo en <b style="color:var(--txt)">${nreps(e)}</b> de ${REPS.length} representadas en 2026${e.ruta?` &nbsp;·&nbsp; Ruta <b style="color:var(--txt)">${e.ruta}</b>`:""}</div>
     ${e.aliases&&e.aliases.length?`<div class="alias">También aparece como: ${e.aliases.join(" · ")}</div>`:""}
   </div>
   <div class="mbody">
     <div class="totrow">
       <div class="totbox"><div class="ty">Total 2024</div><div class="tv">${eur0(tt24)}</div></div>
       <div class="totbox"><div class="ty">Total 2025</div><div class="tv">${eur0(tt25)}</div></div>
       <div class="totbox hl"><div class="ty">2026 a junio</div><div class="tv">${eur0(tt26)}</div></div>
     </div>
     <h3>Detalle por representada</h3>
     <div class="rep-grid">${boxes}</div>
   </div>`;
 document.getElementById("modal").classList.add("show");
 document.querySelector(".modal .box").scrollTop=0;
}
function closeM(){document.getElementById("modal").classList.remove("show");}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeM();});
document.getElementById("tabs").addEventListener("click",e=>{const t=e.target.closest(".tab");if(!t)return;TAB=t.dataset.t;render();});
repSel.addEventListener("change",e=>{REP=e.target.value;render();});
rutaSel.addEventListener("change",e=>{RUTA=e.target.value;render();});
comercialSel.addEventListener("change",e=>{COMERCIAL=e.target.value;render();});
let deb;document.getElementById("q").addEventListener("input",e=>{clearTimeout(deb);deb=setTimeout(()=>{Q=e.target.value.trim();render();},120);});
render();
</script>
</body>
</html>
